services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - runly-net
    env_file: .env
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1.0
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - runly-net
    env_file: .env
    restart: unless-stopped
    mem_limit: 512m
    cpus: 2.0

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - runly-net
    env_file: .env
    restart: unless-stopped
    mem_limit: 1g
    cpus: 4.0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - runly-net
    env_file: .env
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  runly-net:
