worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Gzip compression enabled
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client max body size limits
    client_max_body_size 1M;

    # Proper timeout settings for long-running code executions
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    server {
        listen 80;
        server_name _;

        # Custom error pages for 502/503
        error_page 502 /502.html;
        error_page 503 /503.html;

        location = /502.html {
            default_type text/html;
            return 502 "<html><body><h1>502 Bad Gateway</h1><p>Runly.dev services are currently unavailable.</p></body></html>";
        }

        location = /503.html {
            default_type text/html;
            return 503 "<html><body><h1>503 Service Unavailable</h1><p>Runly.dev is experiencing heavy load.</p></body></html>";
        }

        # / -> frontend:3000
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /api/ -> api:8000
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /ws/ -> api:8000 with WebSocket upgrade
        location /ws/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
