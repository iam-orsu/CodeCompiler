worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Gzip compression enabled
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client max body size limits
    client_max_body_size 1M;

    # Timeouts aligned with code execution limits (30s compiled + buffer)
    proxy_read_timeout 45s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;

    # Security headers applied globally
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://unpkg.com https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://ajax.googleapis.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss: https://cdn.jsdelivr.net; frame-src 'self' blob:; worker-src 'self' blob:;" always;

    # Rate limiting zone for API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        # Custom error pages for 502/503
        error_page 502 /502.html;
        error_page 503 /503.html;

        location = /502.html {
            default_type text/html;
            return 502 "<html><body><h1>502 Bad Gateway</h1><p>Runly.dev services are currently unavailable.</p></body></html>";
        }

        location = /503.html {
            default_type text/html;
            return 503 "<html><body><h1>503 Service Unavailable</h1><p>Runly.dev is experiencing heavy load.</p></body></html>";
        }

        # / -> frontend:3000
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /api/ -> api:8000 with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /ws/ -> api:8000 with WebSocket upgrade + aligned timeouts
        location /ws/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WS-specific: must exceed max execution timeout (30s) + buffer
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }
    }
}
